# Scheduled slow tier: replication tests (train small models, check acceptance
# criteria) and notebook smoke tests on the quick profile. Optional per SPEC §5.
name: Slow tests

on:
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  slow:
    name: Replication and notebook tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: pytest (slow)
        run: uv run pytest -m slow --nbmake tests/replication notebooks
