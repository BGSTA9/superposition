# E12 activation_functions (extension; Paper: p. 51, with E02's setup from pp. 14–16, 51–53).
# SPEC §7 E12; decisions D-601, D-602. E02's experiment with the output ReLU replaced by each
# activation below: same grids, ten models per cell (the highest-loss one is dropped and the
# other nine vote, p. 14), same seed and training. No pass/fail: every row is INFO.
experiment: activation_functions
base:
  seed: 0
  device: auto
  activations: [relu, gelu, silu, softplus, leaky_relu, sigmoid]
  reference: relu
  settings:
    - {label: n2_m1, n_features: 2, n_hidden: 1, paper_page: p. 15}
  grid:
    importance_min: 0.1
    importance_max: 10.0
    n_importance: 8
    density_min: 0.01
    density_max: 1.0
    n_density: 8
  models_per_cell: 10
  discard_worst: 1
  base_importance: 1.0
  theory:
    scale_max: 4.0
    scale_grid: 41
    bias_min: -8.0
    bias_max: 4.0
    bias_grid: 121
    golden_iterations: 30
    quadrature_nodes: 12
    check_nodes: 24
  thresholds:
    represented_norm: 0.5
    superposition_score: 0.05
    agreement_min: 0.8
    near_boundary_relative_gap: 0.05
  train:
    steps: 10000
    batch_size: 256
    lr: 1.0e-3
    schedule: constant
    log_every: 500
    eval_samples: 20000
profiles:
  # quick: n = 2, m = 1 on an 8 × 8 grid, six activations × 640 models, batch 256.
  # Runtime: to be measured (estimated from a 1,000-step benchmark: ≈ 9 minutes on an Apple M2 CPU).
  quick: {}
  # full: both E02 problems on E02's quick grid (12 × 12, batch 256), so the ReLU column is E02's
  # quick run. Not run; estimated from E02's measured 474 s of training per activation: ≈ 1 hour
  # on an Apple M2 CPU.
  full:
    settings:
      - {label: n2_m1, n_features: 2, n_hidden: 1, paper_page: p. 15}
      - {label: n3_m2, n_features: 3, n_hidden: 2, paper_page: p. 16}
    grid:
      n_importance: 12
      n_density: 12
