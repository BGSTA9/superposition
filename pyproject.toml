[project]
name = "superposition"
version = "0.1.0"
description = "A research-grade, independent replication of Toy Models of Superposition (Elhage et al., 2022), with an interactive lab and mechanistic-interpretability tooling."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "superposition contributors" }]
keywords = ["interpretability", "superposition", "toy models", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "einops>=0.8",
    "jaxtyping>=0.2.34",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pandas>=2.2",
    "pyarrow>=15",
    "networkx>=3.2",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "streamlit>=1.35",
]

[project.urls]
Paper = "https://transformer-circuits.pub/2022/toy_model/index.html"

[project.scripts]
superposition = "superposition.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.7",
    "nbmake>=1.5",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superposition"]

# CPU-only torch wheels on Linux (CI). macOS and Windows wheels on PyPI are already
# CPU/MPS builds. See docs/DECISIONS.md (2026-09-29, "CPU-only torch on Linux").
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
# F722: jaxtyping shape strings such as Float[Tensor, "inst feat"] are not Python
# expressions. This is the ignore jaxtyping's documentation recommends.
ignore = ["F722", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["superposition"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["src", "tests", "app"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: trains models or executes notebooks; excluded from CI via -m 'not slow'",
]
