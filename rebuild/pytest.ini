# Test configuration of the rebuild kit (rebuild/README.md, docs/cookbook/05_engine.md).
# Run from the repository root: `make rebuild-test`, or one milestone with
# `uv run pytest -c rebuild/pytest.ini rebuild/tests/test_data.py`.
# The kit is kept out of the main test suite, lint, type checks and CI on purpose: its
# skeleton fails every test until you implement it.
[pytest]
pythonpath = .
testpaths = tests
addopts = -ra
